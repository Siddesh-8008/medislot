
name: Test AWS OIDC

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test-aws-oidc:
    name: Verify AWS OIDC connection
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::466646843582:role/MediSlotGitHubActionsRole
          aws-region: ap-south-1

      - name: Verify assumed AWS identity
        run: aws sts get-caller-identity
