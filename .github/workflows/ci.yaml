name: CI

# Runs on every pull request into master. The final job, "CI Gate", is the one required status
# check in the branch protection rule: it is green only if every job above it is green.
on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run unit tests (a failing test fails the build)
        run: python -m pytest -v

  secret-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Only needed if the repository belongs to a GitHub organisation:
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  iac-scan:
    name: IaC scanning (cfn-lint + checkov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scanners
        run: python -m pip install cfn-lint checkov
      - name: cfn-lint (errors fail the build; warnings are shown)
        run: cfn-lint --ignore-checks W cloudformation/*.yaml
      - name: checkov security scan
        # Reporting mode first: review the findings, fix or justify them, then delete the
        # soft-fail line so any new finding fails the build.
        run: checkov -d cloudformation --framework cloudformation --compact --quiet --soft-fail

  package-check:
    name: Lambda package builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the Lambda zip exactly as the deploy pipeline does
        run: bash scripts/build-lambda.sh

  ci-gate:
    name: CI Gate
    if: ${{ always() }}
    needs: [unit-tests, secret-scan, iac-scan, package-check]
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI job to have succeeded
        run: |
          if [[ '${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}' == 'true' ]]; then
            echo "One or more CI jobs did not succeed"; exit 1
          fi
