name: MediSlot Milestone 2 CI and Deployment

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main
    paths:
      - "cloudformation/**"
      - "lambdas/**"
      - "tests/**"
      - "scripts/**"
      - ".github/workflows/**"
      - "requirements-dev.txt"
      - "README.md"
      - "schema/**"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  security-events: write

concurrency:
  group: medislot-m2-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
  AWS_DEFAULT_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
  ENVIRONMENT: ${{ vars.ENVIRONMENT || 'dev' }}

jobs:
  ci:
    name: CI - Tests and Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run unit tests
        env:
          AWS_REGION: ap-south-1
          AWS_DEFAULT_REGION: ap-south-1
        run: pytest -q

      - name: Check Python syntax
        run: python -m compileall -q lambdas tests

      - name: Validate CloudFormation templates
        run: |
          pip install cfn-lint
          cfn-lint cloudformation/*.yaml

      - name: Scan for exposed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Infrastructure security scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: cloudformation
          framework: cloudformation
          soft_fail: true

  deploy:
    name: Deploy to AWS
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request'

    needs: ci
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate AWS deployment role
        shell: bash
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN || secrets.AWS_DEPLOY_ROLE_ARN }}
        run: |
          set -euo pipefail

          if [[ -z "${AWS_DEPLOY_ROLE_ARN:-}" ]]; then
            echo "::error::Configure AWS_DEPLOY_ROLE_ARN in GitHub repository variables or secrets."
            exit 1
          fi

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN || secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      # This assumes the deployment role already has enough permissions
      # to create/update this IAM stack.
      - name: Deploy IAM stack
        shell: bash
        run: |
          set -euo pipefail

          python scripts/deploy_stack.py \
            cloudformation/iam-stack.yaml \
            "medislot-${ENVIRONMENT}-iam" \
            "Environment=${ENVIRONMENT}" \
            "GitHubActionsRoleName=MediSlotGitHubActionsRole"

      - name: Deploy network stack
        shell: bash
        run: |
          set -euo pipefail

          python scripts/deploy_stack.py \
            cloudformation/network-stack.yaml \
            "medislot-${ENVIRONMENT}-network" \
            "Environment=${ENVIRONMENT}"

      - name: Create or verify SSM secrets
        shell: bash
        run: |
          set -euo pipefail

          DB_PASSWORD_PARAMETER="/medislot/${ENVIRONMENT}/db/password"
          JWT_SECRET_PARAMETER="/medislot/${ENVIRONMENT}/auth/jwt-secret"

          if ! aws ssm get-parameter \
            --name "$DB_PASSWORD_PARAMETER" \
            --region "$AWS_REGION" >/dev/null 2>&1; then

            DB_PASSWORD="$(python -c 'import secrets,string; a=string.ascii_letters+string.digits+"!_-+="; print("".join(secrets.choice(a) for _ in range(32)))')"

            aws ssm put-parameter \
              --name "$DB_PASSWORD_PARAMETER" \
              --type SecureString \
              --value "$DB_PASSWORD" \
              --region "$AWS_REGION" >/dev/null

            unset DB_PASSWORD
          fi

          if ! aws ssm get-parameter \
            --name "$JWT_SECRET_PARAMETER" \
            --region "$AWS_REGION" >/dev/null 2>&1; then

            JWT_SECRET="$(python -c 'import secrets; print(secrets.token_urlsafe(64))')"

            aws ssm put-parameter \
              --name "$JWT_SECRET_PARAMETER" \
              --type SecureString \
              --value "$JWT_SECRET" \
              --region "$AWS_REGION" >/dev/null

            unset JWT_SECRET
          fi

      - name: Deploy data stack
        shell: bash
        run: |
          set -euo pipefail

          python scripts/deploy_stack.py \
            cloudformation/data-stack.yaml \
            "medislot-${ENVIRONMENT}-data" \
            "Environment=${ENVIRONMENT}"

      - name: Package and upload Lambda code
        shell: bash
        run: |
          set -euo pipefail

          AWS_ACCOUNT_ID="$(aws sts get-caller-identity \
            --query Account --output text)"

          BUCKET="medislot-${ENVIRONMENT}-artifacts-${AWS_ACCOUNT_ID}"

          for fn in authentication authorizer rds_check; do
            echo "Packaging Lambda: ${fn}"

            tmp="$(mktemp -d)"
            trap 'rm -rf "$tmp"' EXIT

            cp -R "lambdas/${fn}/." "$tmp/"
            cp "lambdas/common.py" "$tmp/common.py"

            pip install \
              --quiet \
              -r "lambdas/${fn}/requirements.txt" \
              -t "$tmp"

            (
              cd "$tmp"
              zip -qr "$GITHUB_WORKSPACE/${fn}.zip" .
            )

            aws s3 cp \
              "$GITHUB_WORKSPACE/${fn}.zip" \
              "s3://${BUCKET}/lambda/${GITHUB_SHA}/${fn}.zip" \
              --sse AES256 \
              --region "$AWS_REGION"

            rm -f "$GITHUB_WORKSPACE/${fn}.zip"
            rm -rf "$tmp"
            trap - EXIT
          done

      - name: Deploy authentication API stack
        shell: bash
        run: |
          set -euo pipefail

          ACCOUNT="$(aws sts get-caller-identity \
            --query Account --output text)"

          python scripts/deploy_stack.py \
            cloudformation/auth-stack.yaml \
            "medislot-${ENVIRONMENT}-auth" \
            "Environment=${ENVIRONMENT}" \
            "ArtifactBucket=medislot-${ENVIRONMENT}-artifacts-${ACCOUNT}" \
            "ArtifactPrefix=lambda/${GITHUB_SHA}"

      - name: Display deployed API outputs
        shell: bash
        run: |
          set -euo pipefail

          aws cloudformation describe-stacks \
            --stack-name "medislot-${ENVIRONMENT}-auth" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].Outputs[*].[OutputKey,OutputValue]' \
            --output table

      - name: Diagnose RDS networking
        continue-on-error: true
        shell: bash
        run: |
          echo "== RDS instance (status, VPC, security groups) =="
          aws rds describe-db-instances \
            --db-instance-identifier "medislot-${ENVIRONMENT}-mysql" \
            --region "$AWS_REGION" \
            --query 'DBInstances[0].[DBInstanceStatus,DBSubnetGroup.VpcId,VpcSecurityGroups[*].VpcSecurityGroupId]' \
            --output json

          echo "== Network stack outputs (expected values) =="
          aws cloudformation describe-stacks \
            --stack-name "medislot-${ENVIRONMENT}-network" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].Outputs[?OutputKey==`VPCId` || OutputKey==`DatabaseSecurityGroupId` || OutputKey==`LambdaSecurityGroupId`].[OutputKey,OutputValue]' \
            --output json

          echo "== Lambda VPC config (VPC, security groups) =="
          aws lambda get-function-configuration \
            --function-name "medislot-${ENVIRONMENT}-rds-connection-check" \
            --region "$AWS_REGION" \
            --query 'VpcConfig.[VpcId,SecurityGroupIds]' \
            --output json

          echo "== Inbound rules on the security group RDS is using =="
          DB_SG="$(aws rds describe-db-instances \
            --db-instance-identifier "medislot-${ENVIRONMENT}-mysql" \
            --region "$AWS_REGION" \
            --query 'DBInstances[0].VpcSecurityGroups[0].VpcSecurityGroupId' \
            --output text)"
          aws ec2 describe-security-groups \
            --group-ids "$DB_SG" \
            --region "$AWS_REGION" \
            --query 'SecurityGroups[0].IpPermissions' \
            --output json

      - name: Test RDS connectivity
        shell: bash
        run: |
          set -euo pipefail

          aws lambda invoke \
            --function-name "medislot-${ENVIRONMENT}-rds-connection-check" \
            --payload '{"correlationId":"github-actions-smoke-test"}' \
            --cli-binary-format raw-in-base64-out \
            /tmp/rds-check.json \
            --region "$AWS_REGION" >/dev/null

          cat /tmp/rds-check.json

          python -c '
          import json

          with open("/tmp/rds-check.json") as f:
              result = json.load(f)

          body = result.get("body", {})

          if isinstance(body, str):
              body = json.loads(body)

          assert body.get("connected") is True, result
          '
