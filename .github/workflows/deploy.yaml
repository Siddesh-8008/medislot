
name: MediSlot Deployment Pipeline

on:
  push:
    branches:
      - main
      - feature/milestone-2-foundation
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1
  ENVIRONMENT: dev
  NETWORK_STACK_NAME: medislot-dev-network

jobs:
  validate:
    name: Validate code and infrastructure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install cfn-lint

      - name: Check CloudFormation template
        run: |
          cfn-lint cloudformation/medislot-network.yaml

      - name: Check Python syntax
        run: |
          python -m compileall -q lambda

      - name: Run unit tests
        shell: bash
        run: |
          if compgen -G "tests/unit/test_*.py" > /dev/null; then
            pytest -q tests/unit
          else
            echo "No unit tests created yet; skipping."
          fi

  prepare-network:
    name: Prepare network CloudFormation Change Set
    runs-on: ubuntu-latest
    needs: validate

    # Only create a Change Set when manually requested.
    if: github.event_name == 'workflow_dispatch'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::466646843582:role/MediSlotGitHubActionsRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Create network Change Set without executing it
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/medislot-network.yaml \
            --stack-name "$NETWORK_STACK_NAME" \
            --parameter-overrides Environment="$ENVIRONMENT" \
            --no-execute-changeset \
            --no-fail-on-empty-changeset \
            --tags Project=MediSlot Environment="$ENVIRONMENT"

      - name: Show network stack status
        run: |
          aws cloudformation describe-stacks \
            --stack-name "$NETWORK_STACK_NAME" \
            --query 'Stacks[0].[StackName,StackStatus]' \
            --output table
