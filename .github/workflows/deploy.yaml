
name: MediSlot Milestone 2 CI and Deployment

on:
  pull_request:
    branches: [master]
  push:
    branches: [feature/milestone-2]
    paths:
      - "cloudformation/**"
      - "lambdas/**"
      - "tests/**"
      - "scripts/**"
      - ".github/workflows/**"
      - "requirements-dev.txt"
      - "README.md"
      - "schema/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  security-events: write

concurrency:
  group: medislot-m2-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
  AWS_DEFAULT_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
  ENVIRONMENT: ${{ vars.ENVIRONMENT || 'dev' }}
  AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN || secrets.AWS_DEPLOY_ROLE_ARN }}

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Unit tests
        env:
          AWS_REGION: ap-south-1
          AWS_DEFAULT_REGION: ap-south-1
        run: pytest -q

      - name: Python syntax check
        run: python -m compileall -q lambdas tests

      - name: Validate CloudFormation templates
        run: |
          pip install cfn-lint
          cfn-lint cloudformation/*.yaml

      - name: Secret scanning
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Infrastructure-as-code scanning
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: cloudformation
          framework: cloudformation
          soft_fail: true

  deploy:
    name: deploy
    if: github.ref == 'refs/heads/feature/milestone-2' && github.event_name != 'pull_request'
    needs: ci
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate required OIDC configuration
        shell: bash
        run: |
          if [[ -z "$AWS_DEPLOY_ROLE_ARN" ]]; then
            echo "::error::Set repository variable AWS_DEPLOY_ROLE_ARN to your GitHub OIDC deployment role ARN."
            exit 1
          fi

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify OIDC identity
        run: aws sts get-caller-identity

      - name: Deploy network and data stacks using Change Sets
        shell: bash
        run: |
          set -euo pipefail

          python scripts/deploy_stack.py \
            cloudformation/network-stack.yaml \
            "medislot-${ENVIRONMENT}-network" \
            "Environment=${ENVIRONMENT}"

          # Create deployment-only random credentials; never print their values.
          if aws ssm get-parameter \
            --name "/medislot/${ENVIRONMENT}/db/password" \
            --with-decryption \
            --region "$AWS_REGION" >/dev/null 2>&1; then

            DB_PASSWORD="$(aws ssm get-parameter \
              --name "/medislot/${ENVIRONMENT}/db/password" \
              --with-decryption \
              --query 'Parameter.Value' \
              --output text \
              --region "$AWS_REGION")"
          else
            DB_PASSWORD="$(python -c 'import secrets,string; a=string.ascii_letters+string.digits+"!_-+="; print("".join(secrets.choice(a) for _ in range(32)))')"

            aws ssm put-parameter \
              --name "/medislot/${ENVIRONMENT}/db/password" \
              --type SecureString \
              --value "$DB_PASSWORD" \
              --region "$AWS_REGION" >/dev/null
          fi

          if ! aws ssm get-parameter \
            --name "/medislot/${ENVIRONMENT}/auth/jwt-secret" \
            --region "$AWS_REGION" >/dev/null 2>&1; then

            JWT_SECRET="$(python -c 'import secrets; print(secrets.token_urlsafe(64))')"

            aws ssm put-parameter \
              --name "/medislot/${ENVIRONMENT}/auth/jwt-secret" \
              --type SecureString \
              --value "$JWT_SECRET" \
              --region "$AWS_REGION" >/dev/null

            unset JWT_SECRET
          fi

          python scripts/deploy_stack.py \
            cloudformation/data-stack.yaml \
            "medislot-${ENVIRONMENT}-data" \
            "Environment=${ENVIRONMENT}" \
            "DBPassword=${DB_PASSWORD}"

          unset DB_PASSWORD

      - name: Package and upload Lambda code
        shell: bash
        run: |
          set -euo pipefail

          AWS_ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          BUCKET="medislot-${ENVIRONMENT}-artifacts-${AWS_ACCOUNT_ID}"

          # Upload one deployment package per function.
          for fn in register login refresh logout authorizer rds_check; do
            tmp="$(mktemp -d)"

            cp -R "lambdas/${fn}/." "$tmp/"
            cp "lambdas/common.py" "$tmp/common.py"

            pip install --quiet \
              -r "lambdas/${fn}/requirements.txt" \
              -t "$tmp"

            (cd "$tmp" && zip -qr "$GITHUB_WORKSPACE/${fn}.zip" .)

            aws s3 cp \
              "$GITHUB_WORKSPACE/${fn}.zip" \
              "s3://${BUCKET}/lambda/${GITHUB_SHA}/${fn}.zip" \
              --sse AES256

            rm -rf "$tmp" "$GITHUB_WORKSPACE/${fn}.zip"
          done

      - name: Deploy authentication API stack using Change Set
        shell: bash
        run: |
          set -euo pipefail

          ACCOUNT="$(aws sts get-caller-identity --query Account --output text)"

          python scripts/deploy_stack.py \
            cloudformation/auth-stack.yaml \
            "medislot-${ENVIRONMENT}-auth" \
            "Environment=${ENVIRONMENT}" \
            "ArtifactBucket=medislot-${ENVIRONMENT}-artifacts-${ACCOUNT}" \
            "ArtifactPrefix=lambda/${GITHUB_SHA}"

      - name: Print deployed API URL and test RDS connectivity
        shell: bash
        run: |
          set -euo pipefail

          aws cloudformation describe-stacks \
            --stack-name "medislot-${ENVIRONMENT}-auth" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].Outputs[*].[OutputKey,OutputValue]' \
            --output table

          aws lambda invoke \
            --function-name "medislot-${ENVIRONMENT}-rds-connection-check" \
            --payload '{"correlationId":"github-actions-smoke-test"}' \
            --cli-binary-format raw-in-base64-out \
            /tmp/rds-check.json \
            --region "$AWS_REGION" >/dev/null

          cat /tmp/rds-check.json

          python -c 'import json; d=json.load(open("/tmp/rds-check.json")); assert d.get("body",{}).get("connected") is True, d'
