
name: MediSlot Network Stack

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1
  STACK_NAME: medislot-dev-network
  TEMPLATE_FILE: cloudformation/medislot-network.yaml

jobs:
  validate:
    name: Validate Network Template
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CloudFormation Linter
        run: python -m pip install cfn-lint

      - name: Validate CloudFormation Template
        run: cfn-lint "$TEMPLATE_FILE"

  deploy-network:
    name: Deploy Network Stack
    runs-on: ubuntu-latest
    needs: validate

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::466646843582:role/MediSlotGitHubActionsRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Check Existing Network Stack
        id: stack-check
        shell: bash
        run: |
          if aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy Network Stack
        run: |
          aws cloudformation deploy \
            --template-file "$TEMPLATE_FILE" \
            --stack-name "$STACK_NAME" \
            --parameter-overrides Environment=dev \
            --tags Project=MediSlot Environment=dev \
            --no-fail-on-empty-changeset

      - name: Verify Network Stack Status
        run: |
          aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query 'Stacks[0].[StackName,StackStatus]' \
            --output table

      - name: Display Network Stack Outputs
        run: |
          aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query 'Stacks[0].Outputs[*].[OutputKey,OutputValue]' \
            --output table
