      Integration: {Type: AWS_PROXY, IntegrationHttpMethod: POST, Uri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthenticationFunction.Arn}/invocations'}
  LoginMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref LoginResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration: {Type: AWS_PROXY, IntegrationHttpMethod: POST, Uri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthenticationFunction.Arn}/invocations'}
  RefreshMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref RefreshResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration: {Type: AWS_PROXY, IntegrationHttpMethod: POST, Uri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthenticationFunction.Arn}/invocations'}
  LogoutMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref LogoutResource
      HttpMethod: POST
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ApiAuthorizer
      Integration: {Type: AWS_PROXY, IntegrationHttpMethod: POST, Uri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthenticationFunction.Arn}/invocations'}
  AuthenticationInvokePermission:
    Type: AWS::Lambda::Permission
    Properties: {FunctionName: !Ref AuthenticationFunction, Action: lambda:InvokeFunction, Principal: apigateway.amazonaws.com, SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApi}/*/POST/auth/*'}
  ProtectedInvokePermission:
    Type: AWS::Lambda::Permission
    Properties: {FunctionName: !Ref ProtectedFunction, Action: lambda:InvokeFunction, Principal: apigateway.amazonaws.com, SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApi}/*/GET/*'}
  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - PatientProtectedMethod
      - DoctorProtectedMethod
      - DoctorsMeGetMethod
      - DoctorsMePostMethod
      - DoctorsMePutMethod
      - DoctorsMePatchMethod
      - DoctorsCatalogConsultationTypesGetMethod
      - DoctorsMePhotoUploadUrlPostMethod
      - DoctorsMeConsultationTypesGetMethod
      - DoctorsMeConsultationTypesPostMethod
      - DoctorsMeConsultationTypeIdPutMethod
      - DoctorsMeConsultationTypeIdPatchMethod
      - DoctorsMeConsultationTypeIdDeleteMethod
      - DoctorsMeAvailabilityPatternsGetMethod
      - DoctorsMeAvailabilityPatternsPostMethod
      - DoctorsMeAvailabilityPatternIdPutMethod
      - DoctorsMeAvailabilityPatternIdPatchMethod
      - DoctorsMeAvailabilityPatternIdDeleteMethod
      - DoctorsMeBlackoutDatesGetMethod
      - DoctorsMeBlackoutDatesPostMethod
      - DoctorsMeBlackoutIdDeleteMethod
      - DoctorsMeScheduleGetMethod
      - PatientsMeGetMethod
      - PatientsMePostMethod
      - PatientsMePutMethod
      - PatientsMePatchMethod
      - PatientsMeDeleteMethod
      - PatientsIdGetMethod
      - DoctorsSearchGetMethod
      - DoctorsFiltersGetMethod
      - DoctorsIdGetMethod
      - DoctorsIdSlotsGetMethod
      - RegisterPatientMethod
      - RegisterDoctorMethod
      - LoginMethod
      - RefreshMethod
      - LogoutMethod
    Properties:
      RestApiId: !Ref RestApi
      Description: !Sub 'MediSlot ${Environment} auth API deployment ${ArtifactPrefix}'
  ApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref RestApi
      DeploymentId: !Ref ApiDeployment
      StageName: !Ref Environment
      TracingEnabled: true
      AccessLogSetting:
        DestinationArn: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${ApiAccessLogGroup}'
        Format: '{"requestId":"$context.requestId","ip":"$context.identity.sourceIp","requestTime":"$context.requestTime","httpMethod":"$context.httpMethod","resourcePath":"$context.resourcePath","path":"$context.path","status":"$context.status","responseLength":"$context.responseLength","responseLatencyMs":"$context.responseLatency","integrationLatencyMs":"$context.integrationLatency","authorizerPrincipal":"$context.authorizer.principalId","authorizerError":"$context.authorizer.error","errorMessage":"$context.error.message","userAgent":"$context.identity.userAgent"}'
      MethodSettings:
        - ResourcePath: '/*'
          HttpMethod: '*'
          MetricsEnabled: true
          LoggingLevel: INFO
          DataTraceEnabled: false
Outputs:
  ApiUrl:
    Description: Base URL for the deployed REST API.
    Value: !Sub 'https://${RestApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'
  RegisterPatientUrl:
    Value: !Sub 'https://${RestApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/auth/register/patient'
  RegisterDoctorUrl:
    Value: !Sub 'https://${RestApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/auth/register/doctor'
  LoginUrl:
    Value: !Sub 'https://${RestApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/auth/login'
  DoctorDomainFunctionName: {Value: !Ref DoctorDomainFunction}
  SlotMaterialiserFunctionName: {Value: !Ref SlotMaterialiserFunction}
  PatientDomainFunctionName: {Value: !Ref PatientDomainFunction}
  DoctorDiscoveryFunctionName: {Value: !Ref DoctorDiscoveryFunction}
  AuthenticationFunctionName: {Value: !Ref AuthenticationFunction}
  AuthorizerFunctionName: {Value: !Ref AuthorizerFunction}
  RdsConnectionCheckFunctionName: {Value: !Ref RdsConnectionCheckFunction}
  LambdaLogGroupPrefix:
    Description: CloudWatch log groups for every Lambda (one group per function).
    Value: !Sub '/medislot/${Environment}/lambda/'
  ApiAccessLogGroupName:
    Description: CloudWatch log group with one JSON line per API Gateway request.
    Value: !Ref ApiAccessLogGroup
