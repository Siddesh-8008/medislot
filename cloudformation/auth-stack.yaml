AWSTemplateFormatVersion: '2010-09-09'
Description: MediSlot custom authentication API, JWT authorizer, least-privilege per-function roles.
Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, test, prod]
  ArtifactBucket: {Type: String}
  ArtifactPrefix: {Type: String}
  LogRetentionDays:
    Type: Number
    Default: 30
    Description: How many days CloudWatch keeps Lambda and API Gateway logs.
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365]
Resources:
  LambdaExecutionBasePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub 'MediSlot-${Environment}-LambdaBasePolicy'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: [logs:CreateLogGroup]
            Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/medislot-${Environment}-*'
          - Effect: Allow
            Action: [logs:CreateLogStream, logs:PutLogEvents]
            Resource:
              - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/medislot-${Environment}-*:*'
              - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/medislot/${Environment}/lambda/*:*'
          - Effect: Allow
            Action: [xray:PutTraceSegments, xray:PutTelemetryRecords]
            Resource: '*'
          - Effect: Allow
            Action: [ec2:CreateNetworkInterface, ec2:DescribeNetworkInterfaces, ec2:DeleteNetworkInterface, ec2:AssignPrivateIpAddresses, ec2:UnassignPrivateIpAddresses]
            Resource: '*'
  # ---- CloudWatch log groups: one per Lambda, with retention. Lambdas write here via LoggingConfig.
  AuthenticationLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/medislot/${Environment}/lambda/authentication'
      RetentionInDays: !Ref LogRetentionDays
  AuthorizerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/medislot/${Environment}/lambda/authorizer'
      RetentionInDays: !Ref LogRetentionDays
  RdsConnectionCheckLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/medislot/${Environment}/lambda/rds-connection-check'
      RetentionInDays: !Ref LogRetentionDays
  ProtectedTestLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/medislot/${Environment}/lambda/protected-test'
      RetentionInDays: !Ref LogRetentionDays
  DoctorDomainLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/medislot/${Environment}/lambda/doctor-domain'
      RetentionInDays: !Ref LogRetentionDays
  SlotMaterialiserLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/medislot/${Environment}/lambda/slot-materialiser'
      RetentionInDays: !Ref LogRetentionDays
  PatientDomainLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/medislot/${Environment}/lambda/patient-domain'
      RetentionInDays: !Ref LogRetentionDays
  DoctorDiscoveryLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/medislot/${Environment}/lambda/doctor-discovery'
      RetentionInDays: !Ref LogRetentionDays
  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/medislot/${Environment}/apigateway/access'
      RetentionInDays: !Ref LogRetentionDays
  AuthorizerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'MediSlot-${Environment}-AuthorizerRole'
      AssumeRolePolicyDocument: {Version: '2012-10-17', Statement: [{Effect: Allow, Principal: {Service: lambda.amazonaws.com}, Action: sts:AssumeRole}]}
      ManagedPolicyArns: [!Ref LambdaExecutionBasePolicy]
      Policies:
        - PolicyName: AuthorizerRuntimeAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - {Effect: Allow, Action: [ssm:GetParameter], Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/medislot/${Environment}/auth/jwt-secret'}
              - {Effect: Allow, Action: [dynamodb:GetItem], Resource: !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/MediSlot-${Environment}-AuthTokens'}
              - {Effect: Allow, Action: [kms:Decrypt], Resource: '*'}
  AuthenticationRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'MediSlot-${Environment}-AuthenticationRole'
      AssumeRolePolicyDocument: {Version: '2012-10-17', Statement: [{Effect: Allow, Principal: {Service: lambda.amazonaws.com}, Action: sts:AssumeRole}]}
      ManagedPolicyArns: [!Ref LambdaExecutionBasePolicy]
      Policies:
        - PolicyName: AuthenticationRuntimeAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - {Effect: Allow, Action: [ssm:GetParameter], Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/medislot/${Environment}/*'}
              - {Effect: Allow, Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem], Resource: !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/MediSlot-${Environment}-AuthTokens'}
              - {Effect: Allow, Action: [kms:Decrypt], Resource: '*'}
  AuthenticationFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'medislot-${Environment}-authentication'
      LoggingConfig:
        LogFormat: Text
        LogGroup: !Ref AuthenticationLogGroup
      Runtime: python3.12
      Handler: lambda_function.handler
      Role: !GetAtt AuthenticationRole.Arn
      TracingConfig: {Mode: Active}
      Timeout: 15
      MemorySize: 256
      Code: {S3Bucket: !Ref ArtifactBucket, S3Key: !Sub '${ArtifactPrefix}/authentication.zip'}
      VpcConfig:
        SecurityGroupIds: [!ImportValue {Fn::Sub: 'MediSlot-${Environment}-LambdaSecurityGroupId'}]
        SubnetIds:
          - Fn::ImportValue: !Sub 'MediSlot-${Environment}-PrivateSubnet1Id'
          - Fn::ImportValue: !Sub 'MediSlot-${Environment}-PrivateSubnet2Id'
      Environment: {Variables: {ENVIRONMENT: !Ref Environment}}
  AuthorizerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'medislot-${Environment}-authorizer'
      LoggingConfig:
        LogFormat: Text
        LogGroup: !Ref AuthorizerLogGroup
      Runtime: python3.12
      Handler: lambda_function.handler
      Role: !GetAtt AuthorizerRole.Arn
      TracingConfig: {Mode: Active}
      Timeout: 10
      MemorySize: 256
      Code: {S3Bucket: !Ref ArtifactBucket, S3Key: !Sub '${ArtifactPrefix}/authorizer.zip'}
      VpcConfig:
        SecurityGroupIds: [!ImportValue {Fn::Sub: 'MediSlot-${Environment}-LambdaSecurityGroupId'}]
        SubnetIds:
          - Fn::ImportValue: !Sub 'MediSlot-${Environment}-PrivateSubnet1Id'
          - Fn::ImportValue: !Sub 'MediSlot-${Environment}-PrivateSubnet2Id'
      Environment: {Variables: {ENVIRONMENT: !Ref Environment}}
  RdsCheckRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'MediSlot-${Environment}-RdsCheckRole'
      AssumeRolePolicyDocument: {Version: '2012-10-17', Statement: [{Effect: Allow, Principal: {Service: lambda.amazonaws.com}, Action: sts:AssumeRole}]}
      ManagedPolicyArns: [!Ref LambdaExecutionBasePolicy]
      Policies:
        - PolicyName: RdsCheckRuntimeAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - {Effect: Allow, Action: [ssm:GetParameter], Resource: [!Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/medislot/${Environment}/db/*', !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/medislot/${Environment}/auth/jwt-secret']}
              - {Effect: Allow, Action: [kms:Decrypt], Resource: '*'}
  RdsConnectionCheckFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'medislot-${Environment}-rds-connection-check'
      LoggingConfig:
        LogFormat: Text
        LogGroup: !Ref RdsConnectionCheckLogGroup
      Runtime: python3.12
      Handler: lambda_function.handler
      Role: !GetAtt RdsCheckRole.Arn
      Timeout: 10
      MemorySize: 128
      Code: {S3Bucket: !Ref ArtifactBucket, S3Key: !Sub '${ArtifactPrefix}/rds_check.zip'}
      VpcConfig:
        SecurityGroupIds: [!ImportValue {Fn::Sub: 'MediSlot-${Environment}-LambdaSecurityGroupId'}]
        SubnetIds:
          - Fn::ImportValue: !Sub 'MediSlot-${Environment}-PrivateSubnet1Id'
          - Fn::ImportValue: !Sub 'MediSlot-${Environment}-PrivateSubnet2Id'
      Environment: {Variables: {ENVIRONMENT: !Ref Environment}}
  ProtectedFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'MediSlot-${Environment}-ProtectedTestRole'
      AssumeRolePolicyDocument: {Version: '2012-10-17', Statement: [{Effect: Allow, Principal: {Service: lambda.amazonaws.com}, Action: sts:AssumeRole}]}
      ManagedPolicyArns: [!Ref LambdaExecutionBasePolicy]
  ProtectedFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'medislot-${Environment}-protected-test'
      LoggingConfig:
        LogFormat: Text
        LogGroup: !Ref ProtectedTestLogGroup
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt ProtectedFunctionRole.Arn
      Timeout: 5
      Code:
        ZipFile: |
          import json
          def handler(event, context):
              ctx = event.get("requestContext", {}).get("authorizer", {})
              return {"statusCode": 200, "headers": {"content-type":"application/json"},
                      "body": json.dumps({"message":"Role-authorized test endpoint",
                                           "userId":ctx.get("userId"),"role":ctx.get("role")})}
  RestApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub 'medislot-${Environment}-api'
      EndpointConfiguration: {Types: [REGIONAL]}
  ApiAuthorizer:
    Type: AWS::ApiGateway::Authorizer
    Properties:
      Name: !Sub 'medislot-${Environment}-jwt-authorizer'
      RestApiId: !Ref RestApi
      Type: TOKEN
      IdentitySource: method.request.header.Authorization
      AuthorizerResultTtlInSeconds: 0
      AuthorizerUri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthorizerFunction.Arn}/invocations'
  AuthorizerInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AuthorizerFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApi}/authorizers/${ApiAuthorizer}'
  PatientResource:
    Type: AWS::ApiGateway::Resource
    Properties: {RestApiId: !Ref RestApi, ParentId: !GetAtt RestApi.RootResourceId, PathPart: patient}
  DoctorResource:
    Type: AWS::ApiGateway::Resource
    Properties: {RestApiId: !Ref RestApi, ParentId: !GetAtt RestApi.RootResourceId, PathPart: doctor}

  DoctorDomainRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'MediSlot-${Environment}-DoctorDomainRole'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns: [!Ref LambdaExecutionBasePolicy]
      Policies:
        - PolicyName: DoctorDomainRuntimeAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [ssm:GetParameter]
                Resource:
                  - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/medislot/${Environment}/db/*'
                  - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/medislot/${Environment}/auth/jwt-secret'
              - Effect: Allow
                Action: [kms:Decrypt]
                Resource: '*'
              - Effect: Allow
                Action: [s3:PutObject]
                Resource: !Sub 'arn:${AWS::Partition}:s3:::medislot-${Environment}-doctor-photos-${AWS::AccountId}-${AWS::Region}/doctors/*'
              - Effect: Allow
                Action: [dynamodb:Query]
                Resource:
                  - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/MediSlot-${Environment}-Slots'
                  - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/MediSlot-${Environment}-Slots/index/GSI_DoctorDate'
              - Effect: Allow
                Action: [lambda:InvokeFunction]
                Resource: !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:medislot-${Environment}-slot-materialiser'
  DoctorDomainFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'medislot-${Environment}-doctor-domain'
      LoggingConfig:
        LogFormat: Text
        LogGroup: !Ref DoctorDomainLogGroup
      Runtime: python3.12
      Handler: lambda_function.handler
      Role: !GetAtt DoctorDomainRole.Arn
      Timeout: 20
      MemorySize: 256
      TracingConfig: {Mode: Active}
      Code: {S3Bucket: !Ref ArtifactBucket, S3Key: !Sub '${ArtifactPrefix}/doctor_domain.zip'}
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          DOCTOR_PHOTOS_BUCKET: !Sub 'medislot-${Environment}-doctor-photos-${AWS::AccountId}-${AWS::Region}'
          SLOT_MATERIALISER_FUNCTION: !Sub 'medislot-${Environment}-slot-materialiser'
      VpcConfig:
        SecurityGroupIds: [!ImportValue {Fn::Sub: 'MediSlot-${Environment}-LambdaSecurityGroupId'}]
        SubnetIds:
          - !ImportValue {Fn::Sub: 'MediSlot-${Environment}-PrivateSubnet1Id'}
          - !ImportValue {Fn::Sub: 'MediSlot-${Environment}-PrivateSubnet2Id'}
  SlotMaterialiserRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'MediSlot-${Environment}-SlotMaterialiserRole'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns: [!Ref LambdaExecutionBasePolicy]
      Policies:
        - PolicyName: SlotMaterialiserRuntimeAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [ssm:GetParameter]
                Resource:
                  - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/medislot/${Environment}/db/*'
              - Effect: Allow
                Action: [kms:Decrypt]
                Resource: '*'
              - Effect: Allow
                Action: [dynamodb:PutItem, dynamodb:UpdateItem]
                Resource: !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/MediSlot-${Environment}-Slots'
              - Effect: Allow
                Action: [dynamodb:Query]
                Resource: !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/MediSlot-${Environment}-Slots/index/GSI_DoctorDate'
  SlotMaterialiserFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'medislot-${Environment}-slot-materialiser'
      LoggingConfig:
        LogFormat: Text
        LogGroup: !Ref SlotMaterialiserLogGroup
      Runtime: python3.12
      Handler: lambda_function.handler
      Role: !GetAtt SlotMaterialiserRole.Arn
      Timeout: 300
      MemorySize: 512
      TracingConfig: {Mode: Active}
      Code: {S3Bucket: !Ref ArtifactBucket, S3Key: !Sub '${ArtifactPrefix}/slot_materialiser.zip'}
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          MATERIALISE_DAYS: '45'
      VpcConfig:
        SecurityGroupIds: [!ImportValue {Fn::Sub: 'MediSlot-${Environment}-LambdaSecurityGroupId'}]
        SubnetIds:
          - !ImportValue {Fn::Sub: 'MediSlot-${Environment}-PrivateSubnet1Id'}
          - !ImportValue {Fn::Sub: 'MediSlot-${Environment}-PrivateSubnet2Id'}
  SlotMaterialiserScheduleRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'MediSlot-${Environment}-SlotMaterialiserScheduleRole'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: scheduler.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeSlotMaterialiser
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [lambda:InvokeFunction]
                Resource: !GetAtt SlotMaterialiserFunction.Arn
  SlotMaterialiserDailySchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub 'medislot-${Environment}-slot-materialiser-daily'
      Description: Extend the rolling 45-day MediSlot slot window daily.
      State: ENABLED
      ScheduleExpression: rate(1 day)
      FlexibleTimeWindow:
        Mode: 'OFF'
      Target:
        Arn: !GetAtt SlotMaterialiserFunction.Arn
        RoleArn: !GetAtt SlotMaterialiserScheduleRole.Arn
  # ---- Milestone 4: patient profile API (RDS + AuthTokens for closing an account).
  PatientDomainRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'MediSlot-${Environment}-PatientDomainRole'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns: [!Ref LambdaExecutionBasePolicy]
      Policies:
        - PolicyName: PatientDomainRuntimeAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [ssm:GetParameter]
                Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/medislot/${Environment}/db/*'
              - Effect: Allow
                Action: [kms:Decrypt]
                Resource: '*'
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem]
                Resource: !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/MediSlot-${Environment}-AuthTokens'
  PatientDomainFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'medislot-${Environment}-patient-domain'
      LoggingConfig:
        LogFormat: Text
        LogGroup: !Ref PatientDomainLogGroup
      Runtime: python3.12
      Handler: lambda_function.handler
      Role: !GetAtt PatientDomainRole.Arn
      Timeout: 15
      MemorySize: 256
      TracingConfig: {Mode: Active}
      Code: {S3Bucket: !Ref ArtifactBucket, S3Key: !Sub '${ArtifactPrefix}/patient_domain.zip'}
      Environment: {Variables: {ENVIRONMENT: !Ref Environment}}
      VpcConfig:
        SecurityGroupIds: [!ImportValue {Fn::Sub: 'MediSlot-${Environment}-LambdaSecurityGroupId'}]
        SubnetIds:
          - !ImportValue {Fn::Sub: 'MediSlot-${Environment}-PrivateSubnet1Id'}
          - !ImportValue {Fn::Sub: 'MediSlot-${Environment}-PrivateSubnet2Id'}
  PatientDomainInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref PatientDomainFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApi}/*/*/patients/*'
  # ---- Milestone 4: doctor search, public doctor profile and slot availability (RDS + read-only DynamoDB).
  DoctorDiscoveryRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'MediSlot-${Environment}-DoctorDiscoveryRole'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns: [!Ref LambdaExecutionBasePolicy]
      Policies:
        - PolicyName: DoctorDiscoveryRuntimeAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [ssm:GetParameter]
                Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/medislot/${Environment}/db/*'
              - Effect: Allow
                Action: [kms:Decrypt]
                Resource: '*'
              - Effect: Allow
                Action: [dynamodb:Query]
                Resource:
                  - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/MediSlot-${Environment}-Slots'
                  - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/MediSlot-${Environment}-Slots/index/GSI_DoctorDate'
  DoctorDiscoveryFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'medislot-${Environment}-doctor-discovery'
      LoggingConfig:
        LogFormat: Text
        LogGroup: !Ref DoctorDiscoveryLogGroup
      Runtime: python3.12
      Handler: lambda_function.handler
      Role: !GetAtt DoctorDiscoveryRole.Arn
      Timeout: 20
      MemorySize: 256
      TracingConfig: {Mode: Active}
      Code: {S3Bucket: !Ref ArtifactBucket, S3Key: !Sub '${ArtifactPrefix}/doctor_discovery.zip'}
      Environment: {Variables: {ENVIRONMENT: !Ref Environment}}
      VpcConfig:
        SecurityGroupIds: [!ImportValue {Fn::Sub: 'MediSlot-${Environment}-LambdaSecurityGroupId'}]
        SubnetIds:
          - !ImportValue {Fn::Sub: 'MediSlot-${Environment}-PrivateSubnet1Id'}
          - !ImportValue {Fn::Sub: 'MediSlot-${Environment}-PrivateSubnet2Id'}
  DoctorDiscoveryInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref DoctorDiscoveryFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApi}/*/GET/doctors/*'
  DoctorDomainInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref DoctorDomainFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApi}/*/*/doctors/*'
  # ---- Doctor dashboard endpoints: every path and HTTP method is its own API Gateway method in this
  # same REST API (same stage, same authorizer as /auth/*, /doctor and /patient). All of them
  # invoke the doctor-domain Lambda, which checks that the caller has the DOCTOR role.
  DoctorsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !GetAtt RestApi.RootResourceId
      PathPart: doctors
  DoctorsMeResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !Ref DoctorsResource
      PathPart: 'me'
  DoctorsCatalogResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !Ref DoctorsResource
      PathPart: 'catalog'
  DoctorsCatalogConsultationTypesResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !Ref DoctorsCatalogResource
      PathPart: 'consultation-types'
  DoctorsMePhotoUploadUrlResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !Ref DoctorsMeResource
      PathPart: 'photo-upload-url'
  DoctorsMeConsultationTypesResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !Ref DoctorsMeResource
      PathPart: 'consultation-types'
  DoctorsMeConsultationTypeIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !Ref DoctorsMeConsultationTypesResource
      PathPart: '{consultationTypeId}'
  DoctorsMeAvailabilityPatternsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !Ref DoctorsMeResource
      PathPart: 'availability-patterns'
  DoctorsMeAvailabilityPatternIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !Ref DoctorsMeAvailabilityPatternsResource
      PathPart: '{patternId}'
  DoctorsMeBlackoutDatesResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !Ref DoctorsMeResource
      PathPart: 'blackout-dates'
  DoctorsMeBlackoutIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !Ref DoctorsMeBlackoutDatesResource
      PathPart: '{blackoutId}'
  DoctorsMeScheduleResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !Ref DoctorsMeResource
      PathPart: 'schedule'
  DoctorsMeGetMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref DoctorsMeResource
      HttpMethod: GET
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ApiAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DoctorDomainFunction.Arn}/invocations'
  DoctorsMePostMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref DoctorsMeResource
      HttpMethod: POST
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ApiAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DoctorDomainFunction.Arn}/invocations'
  DoctorsMePutMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref DoctorsMeResource
