AWSTemplateFormatVersion: "2010-09-09"
Description: MediSlot doctor dashboard on Amazon Linux 2023 EC2 behind Nginx.

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, test, prod]

  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues: [t3.micro, t3.small]

  AllowedClientCidr:
    Type: String
    Description: Public client IPv4 CIDR allowed to reach the dashboard, normally your-public-ip/32.
    AllowedPattern: ^([0-9]{1,3}\.){3}[0-9]{1,3}/([0-9]|[1-2][0-9]|3[0-2])$
    ConstraintDescription: Provide an IPv4 CIDR such as 198.51.100.20/32.

  DashboardArtifactBucket:
    Type: String

  DashboardArtifactKey:
    Type: String

  ApiBaseUrl:
    Type: String
    Description: Base URL output by the MediSlot authentication API stack.

Resources:
  DashboardSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub MediSlot ${Environment} doctor dashboard access
      VpcId:
        Fn::ImportValue: !Sub MediSlot-${Environment}-VPCId
      SecurityGroupIngress:
        - Description: Dashboard HTTP ingress restricted to the configured client CIDR.
          IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !Ref AllowedClientCidr
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub medislot-${Environment}-dashboard-sg
        - Key: Project
          Value: MediSlot

  DashboardInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub medislot-${Environment}-dashboard-ec2-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: ReadDashboardRuntimeConfiguration
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/medislot/${Environment}/web/session-secret
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub arn:${AWS::Partition}:s3:::${DashboardArtifactBucket}/${DashboardArtifactKey}
      Tags:
        - Key: Project
          Value: MediSlot

  DashboardInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub medislot-${Environment}-dashboard-ec2-profile
      Roles:
        - !Ref DashboardInstanceRole

  DashboardInstance:
    Type: AWS::EC2::Instance
    DependsOn:
      - DashboardInstanceProfile
    Properties:
      ImageId: '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}'
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref DashboardInstanceProfile
      NetworkInterfaces:
        - AssociatePublicIpAddress: true
          DeviceIndex: '0'
          SubnetId:
            Fn::ImportValue: !Sub MediSlot-${Environment}-PublicSubnetId
          GroupSet:
            - !Ref DashboardSecurityGroup
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
        HttpPutResponseHopLimit: 1
      Tags:
        - Key: Name
          Value: !Sub medislot-${Environment}-doctor-dashboard
        - Key: Project
          Value: MediSlot
      UserData:
        Fn::Base64:
          Fn::Sub: |
            #!/bin/bash
            set -euxo pipefail
            exec > >(tee /var/log/medislot-dashboard-bootstrap.log | logger -t user-data -s 2>/dev/console) 2>&1

            dnf update -y
            dnf install -y python3 python3-pip nginx unzip awscli
            mkdir -p /opt/medislot-dashboard
            aws s3 cp "s3://${DashboardArtifactBucket}/${DashboardArtifactKey}" /tmp/dashboard.zip --region ${AWS::Region}
            unzip -o /tmp/dashboard.zip -d /opt/medislot-dashboard
            test -f /opt/medislot-dashboard/doctor_dashboard.py
            test -f /opt/medislot-dashboard/requirements.txt
            python3 -m venv /opt/medislot-dashboard/venv
            /opt/medislot-dashboard/venv/bin/pip install --upgrade pip
            /opt/medislot-dashboard/venv/bin/pip install -r /opt/medislot-dashboard/requirements.txt gunicorn

            cat > /etc/medislot-dashboard.env <<'ENVVARS'
            MEDISLOT_API_BASE=${ApiBaseUrl}
            SESSION_SECRET_PARAMETER=/medislot/${Environment}/web/session-secret
            AWS_DEFAULT_REGION=${AWS::Region}
            ENVVARS
            chmod 600 /etc/medislot-dashboard.env
            chown -R ec2-user:ec2-user /opt/medislot-dashboard

            cat > /etc/systemd/system/medislot-dashboard.service <<'SERVICE'
            [Unit]
            Description=MediSlot Doctor Dashboard
            After=network-online.target
            Wants=network-online.target

            [Service]
            User=ec2-user
            Group=ec2-user
            WorkingDirectory=/opt/medislot-dashboard
            EnvironmentFile=/etc/medislot-dashboard.env
            ExecStart=/opt/medislot-dashboard/venv/bin/gunicorn --workers 2 --bind 127.0.0.1:8000 --access-logfile - --error-logfile - doctor_dashboard:app
            Restart=on-failure
            RestartSec=5
            NoNewPrivileges=true
            PrivateTmp=true

            [Install]
            WantedBy=multi-user.target
            SERVICE

            cat > /etc/nginx/conf.d/medislot-dashboard.conf <<'NGINX'
            server {
                listen 80 default_server;
                server_name _;
                client_max_body_size 6m;
                location / {
                    proxy_pass http://127.0.0.1:8000;
                    proxy_http_version 1.1;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                }
            }
            NGINX

            nginx -t
            systemctl daemon-reload
            systemctl enable --now nginx
            systemctl enable --now medislot-dashboard

Outputs:
  DashboardInstanceId:
    Description: EC2 instance hosting the doctor dashboard.
    Value: !Ref DashboardInstance
  DashboardPublicIp:
    Description: Public IPv4 address; HTTP is restricted to AllowedClientCidr.
    Value: !GetAtt DashboardInstance.PublicIp
  DashboardSecurityGroupId:
    Description: Security group controlling dashboard ingress.
    Value: !Ref DashboardSecurityGroup
