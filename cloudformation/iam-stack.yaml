
AWSTemplateFormatVersion: '2010-09-09'
Description: >
  MediSlot Lambda execution roles.
  Resource-specific permissions will be scoped to the finalized
  DynamoDB tables, queues, parameters, and event bus.

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - test
      - prod
    Description: Deployment environment.

Resources:
  RegisterLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'MediSlot-${Environment}-register-lambda-role'
      Description: Execution role for patient and doctor registration.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole'

  LoginLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'MediSlot-${Environment}-login-lambda-role'
      Description: Execution role for MediSlot login.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole'

  RefreshLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'MediSlot-${Environment}-refresh-lambda-role'
      Description: Execution role for refresh-token rotation.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'

  LogoutLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'MediSlot-${Environment}-logout-lambda-role'
      Description: Execution role for refresh-token revocation.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'

  AuthorizerLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'MediSlot-${Environment}-authorizer-lambda-role'
      Description: Execution role for JWT verification and role enforcement.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'

  AppointmentLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'MediSlot-${Environment}-appointment-lambda-role'
      Description: Execution role for appointment booking and management.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole'

  SlotLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'MediSlot-${Environment}-slot-lambda-role'
      Description: Execution role for slot availability and conditional holds.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'

  WaitlistLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'MediSlot-${Environment}-waitlist-lambda-role'
      Description: Execution role for waitlist processing and slot offers.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'

  OfferAcceptLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'MediSlot-${Environment}-offer-accept-lambda-role'
      Description: Execution role for accepting waitlist offers.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole'

  NotificationLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'MediSlot-${Environment}-notification-lambda-role'
      Description: Execution role for queued notifications and dispatch logging.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'

  ReminderLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'MediSlot-${Environment}-reminder-lambda-role'
      Description: Execution role for appointment reminder scheduling.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole'

  NoShowLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'MediSlot-${Environment}-no-show-lambda-role'
      Description: Execution role for post-appointment no-show processing.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole'

Outputs:
  RegisterLambdaRoleArn:
    Value: !GetAtt RegisterLambdaRole.Arn

  LoginLambdaRoleArn:
    Value: !GetAtt LoginLambdaRole.Arn

  RefreshLambdaRoleArn:
    Value: !GetAtt RefreshLambdaRole.Arn

  LogoutLambdaRoleArn:
    Value: !GetAtt LogoutLambdaRole.Arn

  AuthorizerLambdaRoleArn:
    Value: !GetAtt AuthorizerLambdaRole.Arn

  AppointmentLambdaRoleArn:
    Value: !GetAtt AppointmentLambdaRole.Arn

  SlotLambdaRoleArn:
    Value: !GetAtt SlotLambdaRole.Arn

  WaitlistLambdaRoleArn:
    Value: !GetAtt WaitlistLambdaRole.Arn

  OfferAcceptLambdaRoleArn:
    Value: !GetAtt OfferAcceptLambdaRole.Arn

  NotificationLambdaRoleArn:
    Value: !GetAtt NotificationLambdaRole.Arn

  ReminderLambdaRoleArn:
    Value: !GetAtt ReminderLambdaRole.Arn

  NoShowLambdaRoleArn:
    Value: !GetAtt NoShowLambdaRole.Arn
