AWSTemplateFormatVersion: "2010-09-09"

Description: >
  MediSlot IAM deployment permissions for GitHub Actions,
  including dashboard deployment permissions and the regional API Gateway logging role.

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, test, prod]

  GitHubActionsRoleName:
    Type: String
    Default: MediSlotGitHubActionsRole

Resources:
  MediSlotGitHubActionsDeploymentPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub MediSlot-${Environment}-GitHubActionsDeploymentPolicy
      Roles:
        - !Ref GitHubActionsRoleName
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ManageMediSlotChangeSets
            Effect: Allow
            Action:
              - cloudformation:CreateChangeSet
              - cloudformation:DescribeChangeSet
              - cloudformation:ExecuteChangeSet
              - cloudformation:DeleteChangeSet
              - cloudformation:DescribeStacks
              - cloudformation:DescribeStackEvents
              - cloudformation:DescribeStackResources
              - cloudformation:GetTemplate
            Resource:
              - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/medislot-${Environment}-iam/*
              - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/medislot-${Environment}-network/*
              - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/medislot-${Environment}-data/*
              - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/medislot-${Environment}-auth/*
              - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/medislot-${Environment}-dashboard/*
              - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/medislot-${Environment}-observability/*

          - Sid: InspectCloudFormation
            Effect: Allow
            Action:
              - cloudformation:ValidateTemplate
              - cloudformation:DescribeStackResources
              - cloudformation:DescribeStackDriftDetectionStatus
            Resource: "*"

          # Milestone 7: drift detection (ops workflow) on every MediSlot stack.
          - Sid: DetectMediSlotDrift
            Effect: Allow
            Action:
              - cloudformation:DetectStackDrift
              - cloudformation:DetectStackResourceDrift
              - cloudformation:DescribeStackResourceDrifts
            Resource:
              - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/medislot-${Environment}-*/*

          # Milestone 7: teardown + redeploy from scratch. The IAM stack (this policy) is never deleted by the pipeline.
          - Sid: TeardownApplicationStacks
            Effect: Allow
            Action: cloudformation:DeleteStack
            Resource:
              - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/medislot-${Environment}-network/*
              - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/medislot-${Environment}-data/*
              - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/medislot-${Environment}-auth/*
              - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/medislot-${Environment}-dashboard/*
              - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/medislot-${Environment}-observability/*

          - Sid: EmptyMediSlotBucketsForTeardown
            Effect: Allow
            Action: [s3:ListBucket, s3:ListBucketVersions, s3:DeleteObject, s3:DeleteObjectVersion]
            Resource:
              - !Sub arn:${AWS::Partition}:s3:::medislot-${Environment}-artifacts-${AWS::AccountId}
              - !Sub arn:${AWS::Partition}:s3:::medislot-${Environment}-artifacts-${AWS::AccountId}/*
              - !Sub arn:${AWS::Partition}:s3:::medislot-${Environment}-doctor-photos-${AWS::AccountId}-${AWS::Region}
              - !Sub arn:${AWS::Partition}:s3:::medislot-${Environment}-doctor-photos-${AWS::AccountId}-${AWS::Region}/*

          # ---- Milestone 6 resource types (auth stack) and Milestone 7 observability, all scoped to MediSlot names.
          - Sid: ManageMediSlotQueues
            Effect: Allow
            Action: [sqs:CreateQueue, sqs:DeleteQueue, sqs:GetQueueAttributes, sqs:SetQueueAttributes, sqs:GetQueueUrl,
                     sqs:TagQueue, sqs:UntagQueue, sqs:ListQueueTags]
            Resource: !Sub arn:${AWS::Partition}:sqs:${AWS::Region}:${AWS::AccountId}:medislot-${Environment}-*

          - Sid: ManageMediSlotTopics
            Effect: Allow
            Action: [sns:CreateTopic, sns:DeleteTopic, sns:GetTopicAttributes, sns:SetTopicAttributes, sns:Subscribe,
                     sns:Unsubscribe, sns:GetSubscriptionAttributes, sns:TagResource, sns:UntagResource, sns:ListTagsForResource]
            Resource:
              - !Sub arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:medislot-${Environment}-*
              - !Sub arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:medislot-${Environment}-*:*

          - Sid: ManageRescheduleStateMachine
            Effect: Allow
            Action: [states:CreateStateMachine, states:UpdateStateMachine, states:DeleteStateMachine, states:DescribeStateMachine,
                     states:TagResource, states:UntagResource, states:ListTagsForResource]
            Resource: !Sub arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:stateMachine:medislot-${Environment}-*

          - Sid: ManageMediSlotSchedules
            Effect: Allow
            Action: [scheduler:CreateSchedule, scheduler:UpdateSchedule, scheduler:DeleteSchedule, scheduler:GetSchedule]
            Resource: !Sub arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/default/medislot-${Environment}-*

          # Event source mappings have generated ids; the condition limits them to MediSlot functions.
          - Sid: ManageQueueEventSourceMappings
            Effect: Allow
            Action: [lambda:CreateEventSourceMapping, lambda:UpdateEventSourceMapping, lambda:DeleteEventSourceMapping,
                     lambda:GetEventSourceMapping]
            Resource: "*"
            Condition:
              StringLike:
                lambda:FunctionArn: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:medislot-${Environment}-*

          - Sid: ManageMediSlotAlarms
            Effect: Allow
            Action: [cloudwatch:PutMetricAlarm, cloudwatch:DeleteAlarms, cloudwatch:DescribeAlarms, cloudwatch:TagResource,
                     cloudwatch:UntagResource, cloudwatch:ListTagsForResource]
            Resource: !Sub arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:medislot-${Environment}-*

          - Sid: ManageMediSlotBudgets
            Effect: Allow
            Action: [budgets:ModifyBudget, budgets:ViewBudget]
            Resource: !Sub arn:${AWS::Partition}:budgets::${AWS::AccountId}:budget/medislot-${Environment}-*

          # Milestone 7: the DR drill restores into NEW, throw-away copies named medislot-<env>-drill-* / ...-drill-*.
          - Sid: DisasterRecoveryDrillRds
            Effect: Allow
            Action: [rds:DescribeDBInstances, rds:RestoreDBInstanceToPointInTime, rds:DeleteDBInstance, rds:AddTagsToResource]
            Resource:
              - !Sub arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:db:medislot-${Environment}-*
              - !Sub arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:subgrp:*
          - Sid: DisasterRecoveryDrillDynamoSource
            Effect: Allow
            Action: [dynamodb:RestoreTableToPointInTime, dynamodb:DescribeTable, dynamodb:Scan]
            Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/MediSlot-${Environment}-*
          - Sid: DisasterRecoveryDrillDynamoCopy
            Effect: Allow
            Action: [dynamodb:PutItem, dynamodb:GetItem, dynamodb:Query, dynamodb:UpdateItem, dynamodb:DeleteItem,
                     dynamodb:BatchWriteItem, dynamodb:DeleteTable]
            Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/MediSlot-${Environment}-*-drill-*

          - Sid: PassMediSlotServiceRoles
            Effect: Allow
            Action: iam:PassRole
            Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/MediSlot-${Environment}-*
            Condition:
              StringEquals:
                iam:PassedToService: [lambda.amazonaws.com, states.amazonaws.com, scheduler.amazonaws.com]

          - Sid: ManageMediSlotLogGroups
            Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:DeleteLogGroup
              - logs:PutRetentionPolicy
              - logs:DeleteRetentionPolicy
              - logs:TagResource
              - logs:UntagResource
              - logs:TagLogGroup
              - logs:UntagLogGroup
              - logs:ListTagsForResource
              - logs:ListTagsLogGroup
            Resource:
              - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/medislot/${Environment}/*
              - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/events/medislot-${Environment}-*

          - Sid: DescribeLogGroups
            Effect: Allow
            Action: logs:DescribeLogGroups
            Resource: "*"

          # Milestone 5: booking event bus, the rule that copies booking events to CloudWatch Logs,
          # the log-group resource policy that rule needs, and the booking metrics dashboard.
          - Sid: ManageBookingEventBus
            Effect: Allow
            Action:
              - events:CreateEventBus
              - events:DeleteEventBus
              - events:DescribeEventBus
              - events:UpdateEventBus
              - events:PutRule
              - events:DeleteRule
              - events:DescribeRule
              - events:EnableRule
              - events:DisableRule
              - events:PutTargets
              - events:RemoveTargets
              - events:ListTargetsByRule
              - events:TagResource
              - events:UntagResource
              - events:ListTagsForResource
            Resource:
              - !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:event-bus/medislot-${Environment}-*
              - !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/medislot-${Environment}-*
              - !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/medislot-${Environment}-*/*

          - Sid: ManageLogResourcePolicies
            Effect: Allow
            Action:
              - logs:PutResourcePolicy
              - logs:DeleteResourcePolicy
              - logs:DescribeResourcePolicies
            Resource: "*"

          - Sid: ManageBookingDashboard
            Effect: Allow
            Action:
              - cloudwatch:PutDashboard
              - cloudwatch:GetDashboard
              - cloudwatch:DeleteDashboards
            Resource:
              - !Sub arn:${AWS::Partition}:cloudwatch::${AWS::AccountId}:dashboard/medislot-${Environment}-*

          - Sid: ManageBookingParameters
            Effect: Allow
            Action:
              - ssm:PutParameter
              - ssm:GetParameter
              - ssm:GetParameters
              - ssm:DeleteParameter
              - ssm:AddTagsToResource
              - ssm:RemoveTagsFromResource
              - ssm:ListTagsForResource
            Resource:
              - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/medislot/${Environment}/booking/*

          - Sid: ReadCallerIdentity
            Effect: Allow
            Action: sts:GetCallerIdentity
            Resource: "*"

          - Sid: ManageDashboardSessionSecret
            Effect: Allow
            Action:
              - ssm:GetParameter
              - ssm:PutParameter
              - ssm:DescribeParameters
            Resource:
              - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/medislot/${Environment}/web/session-secret

          - Sid: UploadDashboardArtifact
            Effect: Allow
            Action:
              - s3:PutObject
              - s3:AbortMultipartUpload
            Resource:
              - !Sub arn:${AWS::Partition}:s3:::medislot-${Environment}-artifacts-${AWS::AccountId}/dashboard/*

          - Sid: RunDashboardDeployCommand
            Effect: Allow
            Action: ssm:SendCommand
            Resource:
              - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}::document/AWS-RunShellScript
              - !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*

          - Sid: ReadDashboardDeployCommandStatus
            Effect: Allow
            Action:
              - ssm:GetCommandInvocation
              - ssm:ListCommandInvocations
              - ssm:DescribeInstanceInformation
            Resource: "*"

          - Sid: DashboardEC2Operations
            Effect: Allow
            Action:
              - ec2:RunInstances
              - ec2:TerminateInstances
              - ec2:DescribeInstances
              - ec2:DescribeImages
              - ec2:DescribeInstanceTypes
              - ec2:DescribeSecurityGroups
              - ec2:DescribeSubnets
              - ec2:DescribeVpcs
              - ec2:CreateSecurityGroup
              - ec2:DeleteSecurityGroup
              - ec2:AuthorizeSecurityGroupIngress
              - ec2:RevokeSecurityGroupIngress
              - ec2:CreateTags
              - ec2:DeleteTags
              - ec2:DescribeTags
            Resource: "*"

          - Sid: ManageDashboardInstanceRole
            Effect: Allow
            Action:
              - iam:CreateRole
              - iam:DeleteRole
              - iam:GetRole
              - iam:TagRole
              - iam:UntagRole
              - iam:PutRolePolicy
              - iam:DeleteRolePolicy
              - iam:GetRolePolicy
              - iam:ListRolePolicies
              - iam:AttachRolePolicy
              - iam:DetachRolePolicy
              - iam:ListAttachedRolePolicies
            Resource:
              - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/medislot-${Environment}-dashboard-ec2-role

          - Sid: ManageDashboardInstanceProfile
            Effect: Allow
            Action:
              - iam:CreateInstanceProfile
              - iam:DeleteInstanceProfile
              - iam:GetInstanceProfile
              - iam:AddRoleToInstanceProfile
              - iam:RemoveRoleFromInstanceProfile
            Resource:
              - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:instance-profile/medislot-${Environment}-dashboard-ec2-profile

          - Sid: PassDashboardInstanceRole
            Effect: Allow
            Action: iam:PassRole
            Resource:
              - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/medislot-${Environment}-dashboard-ec2-role
            Condition:
              StringEquals:
                iam:PassedToService: ec2.amazonaws.com

  ApiGatewayCloudWatchRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: MediSlotApiGatewayCloudWatchRole
      Description: Allows API Gateway to publish execution logs to CloudWatch.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonAPIGatewayPushToCloudWatchLogs
      Tags:
        - Key: Project
          Value: MediSlot

  ApiGatewayAccount:
    Type: AWS::ApiGateway::Account
    Properties:
      CloudWatchRoleArn: !GetAtt ApiGatewayCloudWatchRole.Arn

Outputs:
  DeploymentRoleName:
    Description: GitHub Actions deployment role receiving the policy.
    Value: !Ref GitHubActionsRoleName

  DeploymentPolicyName:
    Description: Name of the attached deployment policy.
    Value: !Ref MediSlotGitHubActionsDeploymentPolicy

  ApiGatewayCloudWatchRoleArn:
    Description: Regional API Gateway CloudWatch logging role.
    Value: !GetAtt ApiGatewayCloudWatchRole.Arn