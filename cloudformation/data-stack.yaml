
AWSTemplateFormatVersion: '2010-09-09'
Description: MediSlot private RDS MySQL, DynamoDB state tables, S3 buckets and SSM runtime configuration.

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, test, prod]

Resources:
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private subnets across two AZs for MediSlot RDS.
      SubnetIds:
        - Fn::ImportValue: !Sub 'MediSlot-${Environment}-PrivateSubnet1Id'
        - Fn::ImportValue: !Sub 'MediSlot-${Environment}-PrivateSubnet2Id'
      Tags: [{Key: Project, Value: MediSlot}]

  MediSlotDatabase:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub 'medislot-${Environment}-mysql'
      Engine: mysql
      DBInstanceClass: db.t3.micro
      AllocatedStorage: 20
      StorageType: gp3
      StorageEncrypted: true
      PubliclyAccessible: false
      MultiAZ: false
      DBName: medislot
      MasterUsername: medislot_admin
      MasterUserPassword: !Sub '{{resolve:ssm-secure:/medislot/${Environment}/db/password}}'
      Port: 3306
      DBSubnetGroupName: !Ref DBSubnetGroup
      VPCSecurityGroups:
        - Fn::ImportValue: !Sub 'MediSlot-${Environment}-DatabaseSecurityGroupId'
      BackupRetentionPeriod: 7               # Milestone 7: automated backups + point-in-time restore for 7 days
      PreferredBackupWindow: '20:30-21:00'    # 02:00-02:30 IST
      DeleteAutomatedBackups: false
      AutoMinorVersionUpgrade: true
      CopyTagsToSnapshot: true
      Tags:
        - Key: Name
          Value: !Sub 'medislot-${Environment}-mysql'
        - Key: Project
          Value: MediSlot

  SlotsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'MediSlot-${Environment}-Slots'
      BillingMode: PAY_PER_REQUEST
      # One partition per doctor, sorted by start time: slot_key = "<start_at UTC ISO>#<consultation_type_id>".
      # "Doctor X's slots between two instants" is one Query on the base table, so no GSI is needed and every
      # slot write (booking, hold, cancel) is billed once. The public slotId encodes both key parts.
      AttributeDefinitions:
        - AttributeName: doctor_id
          AttributeType: N
        - AttributeName: slot_key
          AttributeType: S
      KeySchema:
        - AttributeName: doctor_id
          KeyType: HASH
        - AttributeName: slot_key
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  IdempotencyTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'MediSlot-${Environment}-Idempotency'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: idempotency_key
          AttributeType: S
      KeySchema:
        - AttributeName: idempotency_key
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  AuthTokensTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'MediSlot-${Environment}-AuthTokens'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: token_key
          AttributeType: S
        - AttributeName: token_type
          AttributeType: S
      KeySchema:
        - AttributeName: token_key
          KeyType: HASH
        - AttributeName: token_type
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  # ---- Milestone 6: waitlists, hold offers and the notification dispatch log.
  # (They replace the unused Milestone 2 placeholders "Waitlist" and "HoldOffers": a waitlist is per doctor-DAY, and
  # a hold must never be deleted by TTL while it still holds a seat, so the TTL attribute is purge_at, set only when
  # the offer can no longer matter.)
  # One partition per doctor-day: waitlist_key = DOC#<doctorId>#DAY#<YYYY-MM-DD>, entry_key = P#<patientId>#D#<dependentId|0>.
  # Each patient also has one summary item (waitlist_key = PATIENT#<id>, entry_key = SUMMARY) that enforces the cap.
  WaitlistEntriesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'MediSlot-${Environment}-WaitlistEntries'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: waitlist_key, AttributeType: S}
        - {AttributeName: entry_key, AttributeType: S}
        - {AttributeName: patient_id, AttributeType: S}
        - {AttributeName: joined_at, AttributeType: S}
      KeySchema:
        - {AttributeName: waitlist_key, KeyType: HASH}
        - {AttributeName: entry_key, KeyType: RANGE}
      GlobalSecondaryIndexes:
        - IndexName: GSI_Patient
          KeySchema:
            - {AttributeName: patient_id, KeyType: HASH}
            - {AttributeName: joined_at, KeyType: RANGE}
          Projection: {ProjectionType: ALL}
      TimeToLiveSpecification: {AttributeName: purge_at, Enabled: true}
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
      SSESpecification: {SSEEnabled: true}

  OffersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'MediSlot-${Environment}-Offers'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: offer_id, AttributeType: S}
        - {AttributeName: status, AttributeType: S}
        - {AttributeName: expires_at, AttributeType: N}
      KeySchema:
        - {AttributeName: offer_id, KeyType: HASH}
      GlobalSecondaryIndexes:
        # The expiry sweeper: status = LIVE AND expires_at <= now (also used for ACCEPTING offers that got stuck).
        - IndexName: GSI_Status
          KeySchema:
            - {AttributeName: status, KeyType: HASH}
            - {AttributeName: expires_at, KeyType: RANGE}
          Projection: {ProjectionType: ALL}
      TimeToLiveSpecification: {AttributeName: purge_at, Enabled: true}
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
      SSESpecification: {SSEEnabled: true}

  NotificationLogTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'MediSlot-${Environment}-NotificationLog'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: dispatch_key
          AttributeType: S
      KeySchema:
        - AttributeName: dispatch_key
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  DoctorPhotosBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'medislot-${Environment}-doctor-photos-${AWS::AccountId}-${AWS::Region}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled

  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'medislot-${Environment}-artifacts-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled

  DBHostParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/medislot/${Environment}/db/host'
      Type: String
      Value: !GetAtt MediSlotDatabase.Endpoint.Address
      Description: MediSlot RDS endpoint hostname.

  DBPortParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/medislot/${Environment}/db/port'
      Type: String
      Value: '3306'

  DBNameParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/medislot/${Environment}/db/name'
      Type: String
      Value: medislot

  DBUsernameParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/medislot/${Environment}/db/username'
      Type: String
      Value: medislot_admin

  PasswordPolicyParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/medislot/${Environment}/auth/password-min-length'
      Type: String
      Value: '12'

  AccessTokenMinutesParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/medislot/${Environment}/auth/access-token-minutes'
      Type: String
      Value: '15'

  RefreshTokenDaysParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/medislot/${Environment}/auth/refresh-token-days'
      Type: String
      Value: '7'

  # ---- Milestone 5: booking rules. Change a value here (or in the console) and the booking Lambda picks it up
  # within 60 seconds - no redeploy. Refund tiers: a tier applies when the cancellation is made at least
  # minHoursBefore hours before the appointment start (inclusive). The last tier must have minHoursBefore 0.
  BookingRefundPolicyParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/medislot/${Environment}/booking/refund-policy'
      Type: String
      Description: Refund tiers for patient cancellations (JSON). Doctor cancellations always refund 100 percent.
      Value: '{"tiers":[{"name":"FULL","minHoursBefore":24,"refundPercent":100},{"name":"PARTIAL","minHoursBefore":2,"refundPercent":50},{"name":"NONE","minHoursBefore":0,"refundPercent":0}]}'

  BookingMaxActiveParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/medislot/${Environment}/booking/max-active-appointments'
      Type: String
      Description: Most upcoming CONFIRMED appointments one patient may hold at once.
      Value: '3'

  BookingMaxPerDoctorPerDayParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/medislot/${Environment}/booking/max-per-doctor-per-day'
      Type: String
      Description: Most CONFIRMED appointments one patient may hold with the same doctor on one local day.
      Value: '1'

  BookingMaxConflictRetriesParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/medislot/${Environment}/booking/max-conflict-retries'
      Type: String
      Description: Bounded retries when the optimistic-concurrency write on a slot loses a race (then 409 SLOT_BUSY).
      Value: '10'

  # ---- Milestone 6: reschedule, waitlist and no-show rules (read at runtime, cached 60 s - no redeploy needed).
  BookingMaxReschedulesParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/medislot/${Environment}/booking/max-reschedules'
      Type: String
      Description: How many times one appointment may be rescheduled (0-2; the schema caps reschedule_count at 2).
      Value: '2'

  BookingRescheduleCutoffParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/medislot/${Environment}/booking/reschedule-cutoff-hours'
      Type: String
      Description: An appointment can no longer be rescheduled this many hours (or less) before it starts.
      Value: '6'

  BookingNoShowGraceParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/medislot/${Environment}/booking/no-show-grace-hours'
      Type: String
      Description: A CONFIRMED appointment that ended this many hours ago without an outcome is marked NO_SHOW.
      Value: '12'

  WaitlistHoldMinutesParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/medislot/${Environment}/waitlist/hold-minutes'
      Type: String
      Description: How long a freed seat is held for the waitlisted patient it is offered to.
      Value: '15'

  WaitlistMaxActiveParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/medislot/${Environment}/waitlist/max-active'
      Type: String
      Description: Most waitlists one patient account can be on at the same time.
      Value: '5'

Outputs:
  DBEndpoint:
    Value: !GetAtt MediSlotDatabase.Endpoint.Address
  DBName:
    Value: medislot
  ArtifactBucketName:
    Value: !Ref ArtifactBucket
  DoctorPhotosBucketName:
    Value: !Ref DoctorPhotosBucket
  SlotsTableName:
    Value: !Ref SlotsTable
  IdempotencyTableName:
    Value: !Ref IdempotencyTable
  AuthTokensTableName:
    Value: !Ref AuthTokensTable
  WaitlistEntriesTableName:
    Value: !Ref WaitlistEntriesTable
  OffersTableName:
    Value: !Ref OffersTable
  DBInstanceIdentifier:
    Value: !Ref MediSlotDatabase
  NotificationLogTableName:
    Value: !Ref NotificationLogTable
