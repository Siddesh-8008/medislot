perties":{"title":"RDS CPU % and connections","region":"${AWS::Region}","stat":"Average","period":300,"view":"timeSeries","metrics":[["AWS/RDS","CPUUtilization","DBInstanceIdentifier","medislot-${Environment}-mysql",{"stat":"Average"}],["AWS/RDS","DatabaseConnections","DBInstanceIdentifier","medislot-${Environment}-mysql",{"stat":"Maximum","yAxis":"right"}]]}},{"type":"metric","x":8,"y":48,"width":8,"height":6,"properties":{"title":"RDS free storage (bytes)","region":"${AWS::Region}","stat":"Minimum","period":300,"view":"timeSeries","metrics":[["AWS/RDS","FreeStorageSpace","DBInstanceIdentifier","medislot-${Environment}-mysql"]]}},{"type":"metric","x":16,"y":48,"width":8,"height":6,"properties":{"title":"DynamoDB throttles and errors","region":"${AWS::Region}","stat":"Sum","period":300,"view":"timeSeries","metrics":[{"expression":"SEARCH('{AWS/DynamoDB,TableName} TableName=\"MediSlot-${Environment}-\" (MetricName=\"ReadThrottleEvents\" OR MetricName=\"WriteThrottleEvents\")', 'Sum', 300)","id":"th","label":""}]}},{"type":"alarm","x":0,"y":54,"width":24,"height":6,"properties":{"title":"Alarms","alarms":["${ApiServerErrorsAlarm.Arn}","${ApiLatencyAlarm.Arn}","${LambdaErrorsAlarm.Arn}","${LambdaThrottlesAlarm.Arn}","${NotificationsDLQAlarm.Arn}","${WaitlistDLQAlarm.Arn}","${NotificationsBacklogAlarm.Arn}","${RdsCpuAlarm.Arn}","${RdsStorageAlarm.Arn}","${DynamoThrottleAlarm.Arn}","${SagaCompensationFailedAlarm.Arn}","${ReschedulesCompensatedAlarm.Arn}","${SagaTimeoutAlarm.Arn}","${OffersOverdueAlarm.Arn}","${SeatReleaseFailuresAlarm.Arn}","${EventPublishFailuresAlarm.Arn}","${NotificationFailuresAlarm.Arn}"]}}]}

  # ---- Cost controls. Activate "Project" as a cost allocation tag once (Billing console -> Cost allocation tags);
  # every MediSlot stack is deployed with the stack tags Project=MediSlot and Environment=<env>, which CloudFormation
  # copies onto every resource that supports tags.
  MediSlotMonthlyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub 'medislot-${Environment}-tagged-monthly'
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: {Amount: !Ref MonthlyBudgetUsd, Unit: USD}
        CostFilters:
          TagKeyValue: ['user:Project$MediSlot']
      NotificationsWithSubscribers:
        - Notification: {NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 80, ThresholdType: PERCENTAGE}
          Subscribers: [{SubscriptionType: SNS, Address: !Ref OpsAlarmTopic}]
        - Notification: {NotificationType: FORECASTED, ComparisonOperator: GREATER_THAN, Threshold: 100, ThresholdType: PERCENTAGE}
          Subscribers: [{SubscriptionType: SNS, Address: !Ref OpsAlarmTopic}]
  AccountMonthlyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub 'medislot-${Environment}-account-monthly'
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: {Amount: !Ref AccountBudgetUsd, Unit: USD}
      NotificationsWithSubscribers:
        - Notification: {NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 80, ThresholdType: PERCENTAGE}
          Subscribers: [{SubscriptionType: SNS, Address: !Ref OpsAlarmTopic}]

Outputs:
  OperationsDashboardName:
    Value: !Ref OperationsDashboard
  OperationsDashboardUrl:
    Value: !Sub 'https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=medislot-${Environment}-operations'
  OpsAlarmTopicArn:
    Value: !Ref OpsAlarmTopic
